name: Build Kurly Price Alert APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare project source
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found in repository root."
            exit 1
          fi
          echo "Using archive: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          test -f KurlyPriceAlert/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build debug APK
        run: gradle -p KurlyPriceAlert :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KurlyPriceAlert-debug-apk
          path: KurlyPriceAlert/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
